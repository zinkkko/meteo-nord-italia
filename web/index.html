<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meteo Nord Italia</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meteo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div id="map"></div>
<canvas id="wind"></canvas>

<header class="top">
  <div class="glass search">
    <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="Cerca una località" autocomplete="off" spellcheck="false">
    <div id="results" class="glass results" hidden></div>
  </div>
  <button id="locate" class="glass round" title="La mia posizione">
    <svg viewBox="0 0 24 24" class="ico"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
  </button>
  <button id="tripBtn" class="glass round" title="Pianifica un viaggio">
    <svg viewBox="0 0 24 24" class="ico"><circle cx="6" cy="18.5" r="2.5"/><circle cx="18" cy="5.5" r="2.5"/><path d="M8.5 18.500H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>
  </button>
</header>

<nav id="layers" class="glass layers"></nav>

<div class="right-tools">
  <button id="windToggle" class="glass pill on" title="Animazione del vento">
    <svg viewBox="0 0 24 24" class="ico"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7a2.5 2.5 0 1 1-2.5 2.5"/></svg>
    <span>Vento animato</span>
  </button>
  <button id="stToggle" class="glass pill on" title="Mostra le stazioni">
    <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/></svg>
    <span id="stCount">Stazioni</span>
  </button>
  <div id="sources" class="glass popover" hidden></div>
</div>

<aside id="panel" class="glass panel" hidden>
  <button id="panelGrab" class="grab" title="Riduci o espandi"></button>
  <button id="panelClose" class="close" title="Chiudi">
    <svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div id="panelBody"></div>
</aside>

<footer class="bottom">
  <div class="glass legend">
    <div class="legend-head"><span id="legendName"></span><span id="probe"></span></div>
    <div class="legend-bar"><canvas id="legendBar" width="520" height="12"></canvas></div>
    <div id="legendTicks" class="ticks"></div>
    <div id="legendCap" class="caps"></div>
    <div id="legendCats" class="cats" hidden></div>
    <div class="legend-key"><i class="kdot"></i> numero con pallino = stazione · senza = modello</div>
  </div>
  <div class="glass timeline">
    <button id="play" class="playbtn" title="Riproduci">
      <svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="tl-main">
      <div class="tl-head">
        <span id="tlLabel">—</span>
        <span id="tlMode" class="badge"></span>
        <span id="upd" class="upd"></span>
        <button id="nowBtn" class="link">Adesso</button>
      </div>
      <input id="slider" type="range" min="0" max="1" value="0" step="1">
      <div id="tlDays" class="tl-days"></div>
    </div>
  </div>
</footer>

<div id="loading" class="loading"><div class="glass loading-card"><div class="spinner"></div><span id="loadingText">Carico i dati delle stazioni…</span></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
