name: Aggiorna e pubblica

# Scarica i dati delle stazioni (e, ogni 3 ore, il modello) e ripubblica il sito su GitHub Pages.
# Gli orari programmati di GitHub sono inaffidabili (anche ore di ritardo), quindi ogni esecuzione,
# una volta finita, aspetta qualche minuto e fa partire la successiva: un aggiornamento ogni ~10 minuti.
# L'orario programmato resta solo come riavvio di sicurezza se la catena si interrompe.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Recupera la griglia gia' pubblicata (evita di riscaricare il modello)
        continue-on-error: true
        run: |
          mkdir -p web/data
          curl -fsSL --max-time 60 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/grid.json" -o web/data/grid.json || rm -f web/data/grid.json
      - name: Scarica i dati
        run: python server.py build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Fa ripartire il prossimo aggiornamento
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 420
          # se un'altra esecuzione e' gia' in coda o in corso, la catena continua da quella
          altre=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pubblica.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
          echo "Altre esecuzioni attive: $altre"
          if [ "$altre" = "0" ]; then
            gh workflow run pubblica.yml -R "$GITHUB_REPOSITORY" --ref main
          fi
