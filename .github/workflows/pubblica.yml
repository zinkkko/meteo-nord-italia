name: Aggiorna e pubblica

# Ogni 10 minuti scarica i dati delle stazioni (e, ogni 3 ore, il modello),
# poi ripubblica il sito su GitHub Pages.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Recupera la griglia gia' pubblicata (evita di riscaricare il modello)
        continue-on-error: true
        run: |
          mkdir -p web/data
          curl -fsSL --max-time 60 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/grid.json" -o web/data/grid.json || rm -f web/data/grid.json
      - name: Scarica i dati
        run: python server.py build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
